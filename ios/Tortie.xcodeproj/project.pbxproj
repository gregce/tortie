			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Phase 316.3. TailscaleKit is built from pinned source by\n# npm run vendor:tailscalekit (build/build-tailscalekit.mjs) and is never\n# committed. This phase only CHECKS that the copy beside the project is the\n# pinned build: the stamp that script writes last must name the commit the\n# pin names, each slice's binary must be there at the size the stamp records,\n# and each slice's whole directory must hash to the digest the stamp records\n# (every file by its path and its sha256, the pipeline below, which\n# frameworkTreeDigest in that script mirrors), so a copy missing a file, or\n# holding one changed by a byte, is this sentence and not a compiler or linker\n# error, and the command below rebuilds it. Each slice's header must also\n# declare tailscale_no_logs_no_support, the switch that turns Tailscale's own\n# logs off before every start (the hardening round). When there is no copy at\n# all Xcode stops before any phase runs, with \"There is no XCFramework found\n# at\" and the path.\n# The files are read without being declared as inputs on purpose: the\n# script sandbox denies only SRCROOT (ios/) and the build directories, and\n# build/ is outside both, so a missing stamp is this sentence rather than\n# Xcode's \"Build input file cannot be found\".\npin=\"${SRCROOT}/../build/tailscalekit-release.json\"\nstamp=\"${SRCROOT}/../build/vendor/tailscalekit/TailscaleKit.stamp.json\"\nwant=$(/usr/bin/plutil -extract commit raw -o - \"$pin\" 2>/dev/null)\nhave=$(/usr/bin/plutil -extract commit raw -o - \"$stamp\" 2>/dev/null)\nif [ -z \"$want\" ] || [ \"$want\" != \"$have\" ]; then\n  echo \"error: TailscaleKit here is not the pinned build. Run npm run vendor:tailscalekit in the repository.\"\n  exit 1\nfi\nkit=\"${SRCROOT}/../build/vendor/tailscalekit/TailscaleKit.xcframework\"\nfor slice in ios-arm64 ios-arm64_x86_64-simulator; do\n  fw=\"$kit/$slice/TailscaleKit.framework\"\n  bytes=$(/usr/bin/plutil -extract \"slices.$slice.bytes\" raw -o - \"$stamp\" 2>/dev/null)\n  size=$(/usr/bin/stat -f %z \"$fw/TailscaleKit\" 2>/dev/null)\n  tree=$(/usr/bin/plutil -extract \"slices.$slice.tree\" raw -o - \"$stamp\" 2>/dev/null)\n  hash=$(cd \"$fw\" 2>/dev/null && /usr/bin/find . -type f -print0 | LC_ALL=C /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/shasum -a 256 | /usr/bin/shasum -a 256 | /usr/bin/cut -d \" \" -f 1)\n  if [ -z \"$bytes\" ] || [ \"$bytes\" != \"$size\" ] || [ -z \"$tree\" ] || [ \"$tree\" != \"$hash\" ] || ! /usr/bin/grep -q tailscale_no_logs_no_support \"$fw/Headers/TailscaleKit.h\" 2>/dev/null; then\n    echo \"error: TailscaleKit here is not the pinned build. Run npm run vendor:tailscalekit in the repository.\"\n    exit 1\n  fi\ndone\n";
