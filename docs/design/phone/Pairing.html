<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair with your Mac</title>
<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
a { color: #4d9de8; }
.step { display: flex; align-items: baseline; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 6px 0; color: inherit; text-decoration: none; }
.place { flex-shrink: 0; font-size: 17px; line-height: 22px; font-weight: 600; color: #4d9de8; }
.words { font-size: 17px; line-height: 22px; color: #C9CACD; }
.detail { font-size: 13px; line-height: 18px; color: #9CA1AB; margin-top: 2px; }
.page { display: inline-flex; align-items: center; min-height: 44px; color: #9CA1AB; text-decoration: none; }
</style>
</head>
<body>
<!-- Phase 333.1 (build/p3331/SPEC.md §5.5.1, D20 to D22, D28): the resting
     face, before anything is pressed. Three numbered steps, each number its
     place in the list; the first is the whole row, a press that opens Tortie
     for Mac's page on tortie.sh. Then the one button, Scan code, which opens
     the camera (PairingScan.html), and only then does iOS ask for it. The
     foot says the phone needs nothing else, holds the one line, and links
     Tortie's own privacy and support pages. There is no typed-code fallback. -->
<div class="t" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #C9CACD; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="padding: 24px 16px 0 16px; flex-shrink: 0;">
    <div style="font-size: 28px; line-height: 34px; font-weight: 600;">Pair with your Mac</div>
  </div>

  <div style="padding: 16px 16px 0 16px; flex-shrink: 0;">
    <a class="step" href="#tortie-sh">
      <span class="place num">1</span>
      <div>
        <div class="words">Get Tortie for Mac</div>
        <div class="detail">Free at tortie.sh · Apple silicon · 0.111 or later</div>
      </div>
    </a>
    <div class="step">
      <span class="place num">2</span>
      <div class="words">Open Settings then Phone</div>
    </div>
    <div class="step">
      <span class="place num">3</span>
      <div class="words">Scan the code</div>
    </div>
  </div>

  <a href="PairingScan.html" style="margin: 24px 16px 0 16px; height: 50px; border-radius: 10px; background: #202329; color: #4d9de8; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">Scan code</a>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 16px 32px 16px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
    <div style="font-size: 13px; line-height: 18px; color: #838996;">Nothing else to install on this phone.</div>
    <div style="font-size: 13px; line-height: 18px; color: #838996;">This iPhone is not paired with a Mac.</div>
    <div style="font-size: 13px; line-height: 18px; color: #838996;"><a class="page" href="#privacy">Privacy</a> · <a class="page" href="#support">Support</a></div>
  </div>
</div>
</body>
</html>
