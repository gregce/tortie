<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>See a sample — the Needs input tab</title>
<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-attention { background: #f5b84a; animation: pulse 1.6s cubic-bezier(0.2, 0, 0, 1) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .dot-attention { animation: none; } }
.row { display: flex; flex-direction: column; gap: 2px; padding: 6px 16px; border-bottom: 1px solid #25282E; text-decoration: none; }
a { color: #4d9de8; }
.tabbar { flex-shrink: 0; height: 83px; box-sizing: border-box; padding-top: 7px; background: #191B20; border-top: 1px solid #25282E; display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #838996; text-decoration: none; }
.tab.on { color: #4d9de8; }
.tab .ico { position: relative; width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; }
.tab .lbl { font-size: 10px; line-height: 12px; font-weight: 500; }
.badge { position: absolute; top: -4px; left: 17px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #f5b84a; color: #131417; font-size: 13px; line-height: 18px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.samplebar { flex-shrink: 0; min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #0E0F13; border-bottom: 1px solid #25282E; }
.samplebar .label { font-size: 13px; line-height: 18px; color: #9CA1AB; }
.samplebar a { display: flex; align-items: center; justify-content: flex-end; min-width: 44px; min-height: 44px; font-size: 13px; line-height: 18px; color: #4d9de8; text-decoration: none; }
</style>
</head>
<body>
<!-- Phase 333.3 (build/p3333/SPEC.md §5.7, D14, D19): the Needs input tab inside
     See a sample. ONE strip at the top of the sample's root, above the three
     tabs, so every page of the sample, upright or sideways, says Sample, with
     Leave sample at the trailing gutter, back to Pairing.html or to the paired
     Mac's lists. Below it the tab exactly as NeedsInput.html draws it, over the
     start state of ios/Tortie/Sample/sample.json: its two waiting sessions,
     their projects, their questions and their ages, as the Mac's own composer
     wrote them. The bell's count is the sample's own waiting count, and the
     sample sends no alert and writes no icon badge. -->
<div class="t" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #C9CACD; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div class="samplebar">
    <span class="label">Sample</span>
    <a href="Pairing.html">Leave sample</a>
  </div>

  <div style="padding: 8px 16px 8px 16px; flex-shrink: 0;">
    <div style="font-size: 28px; line-height: 34px; font-weight: 600; color: #C9CACD;">Needs input</div>
  </div>

  <div style="height: 1px; background: #25282E; flex-shrink: 0;"></div>

  <div class="row">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="dot dot-attention"></span>
      <span style="font-size: 17px; line-height: 22px; font-weight: 500; color: #C9CACD; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">fix-login-redirect</span>
      <span class="num" style="font-size: 13px; color: #838996;">4m</span>
    </div>
    <div style="font-size: 15px; line-height: 20px; color: #9CA1AB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">lighthouse · Do you want to make this edit to redirect.ts?</div>
  </div>

  <div class="row" style="border-bottom: 0;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="dot dot-attention"></span>
      <span style="font-size: 17px; line-height: 22px; font-weight: 500; color: #C9CACD; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">migrate-orders</span>
      <span class="num" style="font-size: 13px; color: #838996;">9m</span>
    </div>
    <div style="font-size: 15px; line-height: 20px; color: #9CA1AB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">orchard · Would you like to run the following command?</div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div class="num" style="font-size: 13px; color: #838996; text-align: right; padding: 16px;">read 4:32 PM</div>

  <div class="tabbar">
    <a class="tab on" href="Sample.html">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15z"></path><path d="M10 21.5h4"></path></svg>
        <div class="badge">2</div>
      </div>
      <div class="lbl">Needs input</div>
    </a>
    <a class="tab" href="Main.html">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="7" r="1.1" fill="currentColor"></circle><circle cx="5" cy="12" r="1.1" fill="currentColor"></circle><circle cx="5" cy="17" r="1.1" fill="currentColor"></circle><path d="M9 7h11M9 12h11M9 17h11"></path></svg>
      </div>
      <div class="lbl">Sessions</div>
    </a>
    <a class="tab" href="Settings.html">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="8" cy="8" r="2.4"></circle><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"></path></svg>
      </div>
      <div class="lbl">Settings</div>
    </a>
  </div>
</div>
</body>
</html>
