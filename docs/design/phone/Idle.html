<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.card { background: #191B20; border: 1px solid #25282E; border-radius: 10px; padding: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-attention { background: #f5b84a; animation: pulse 1.6s cubic-bezier(0.2, 0, 0, 1) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .dot-attention { animation: none; } }
#msg4::placeholder { color: #565B66; opacity: 1; }
.cellhdr { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #9CA1AB; }
a { color: #4d9de8; }
.tabbar { flex-shrink: 0; height: 83px; box-sizing: border-box; padding-top: 7px; background: #191B20; border-top: 1px solid #25282E; display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #838996; text-decoration: none; }
.tab.on { color: #4d9de8; }
.tab .ico { position: relative; width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; }
.tab .lbl { font-size: 10px; line-height: 12px; font-weight: 500; }
.badge { position: absolute; top: -4px; left: 17px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #f5b84a; color: #131417; font-size: 13px; line-height: 18px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }

     Codex session on this Mac sitting idle at its own empty prompt, with the
     message strip AT REST docked above the End bar (his ruling of 2026-10-02,
     "Only when idle at its prompt"; build/p318/SPEC.md D14). Nothing is typed
     yet, so the placeholder and Send are drawn in --text-disabled and Send is
     not a press until the box holds words; Composer.html is the same strip
