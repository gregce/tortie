<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answering a choice</title>
<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.card { background: #191B20; border: 1px solid #25282E; border-radius: 10px; padding: 16px; }
.dot-attention { width: 10px; height: 10px; border-radius: 50%; background: #f5b84a; animation: pulse 1.6s cubic-bezier(0.2, 0, 0, 1) infinite; flex-shrink: 0; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .dot-attention { animation: none; } }
.opt { width: 100%; min-height: 54px; box-sizing: border-box; background: #191B20; border: 1px solid #25282E; border-radius: 6px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; font: inherit; text-align: left; cursor: pointer; }
.chip { width: 24px; height: 24px; border-radius: 4px; background: #202329; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #4d9de8; flex-shrink: 0; font-variant-numeric: tabular-nums; }
a { color: #4d9de8; }
.tabbar { flex-shrink: 0; height: 83px; box-sizing: border-box; padding-top: 7px; background: #191B20; border-top: 1px solid #25282E; display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #838996; text-decoration: none; }
.tab.on { color: #4d9de8; }
.tab .ico { position: relative; width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; }
.tab .lbl { font-size: 10px; line-height: 12px; font-weight: 500; }
.endbar { flex-shrink: 0; height: 50px; box-sizing: border-box; background: #191B20; border-top: 1px solid #25282E; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #e5655e; font-size: 17px; }
.badge { position: absolute; top: -4px; left: 17px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #f5b84a; color: #131417; font-size: 13px; line-height: 18px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<!-- Phase 318: a Claude Code session asking to run a shell command, its options
     PRESSABLE (build/p318/SPEC.md §5.7.4). Every option is a button in the
     agent's own words and numbers, the ones that give the agent more room for
     the rest of the session included (his ruling, "Yes, allow them"), because
     the question says the whole command it will run. One tap types that digit
     into the session and never an Enter; nothing asks for Face ID ("Only for
     End"). The options' words are the real Claude Code 2.1.287 prompt's
     (build/fixtures/reply/claude-bash-2.1.287.txt), its folder written as this
     mock's project. `Answer this in the session.` is drawn only when at least
     one option is NOT a button (a command not said whole, or an agent whose
     questions are not measured: Choice.html). No message box while it waits. -->
<div class="t" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #C9CACD; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0;">
    <a href="Main.html" style="display: flex; align-items: center; gap: 4px; font-size: 17px; color: #4d9de8; text-decoration: none;">
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2 3 9l6 7"></path></svg>Sessions
    </a>
    <div style="font-size: 17px; font-weight: 600;">nightly-tests</div>
    <span style="width: 18px;"></span>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="dot-attention"></span>
      <span style="font-size: 17px; color: #f5b84a;">Needs input</span>
    </div>
    <div style="font-size: 15px; color: #9CA1AB;">Claude Code · webapp</div>
  </div>

  <div class="card" style="margin: 0 16px;">
    <div style="font-size: 20px; line-height: 25px;">The agent is waiting for you.</div>
    <div style="font-size: 17px; line-height: 22px; margin-top: 8px;">Bash <span style="font-family: ui-monospace, Menlo, monospace; font-size: 15px;">npm test</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 16px 0 16px;">
    <button type="button" class="opt"><span class="chip">1</span><span style="font-size: 17px; line-height: 22px; color: #4d9de8;">Yes</span></button>
    <button type="button" class="opt"><span class="chip">2</span><span style="font-size: 17px; line-height: 22px; color: #4d9de8;">Yes, and always allow access to webapp from this project</span></button>
    <button type="button" class="opt"><span class="chip">3</span><span style="font-size: 17px; line-height: 22px; color: #4d9de8;">Yes, and switch to auto mode · auto mode handles these prompts for you</span></button>
    <button type="button" class="opt"><span class="chip">4</span><span style="font-size: 17px; line-height: 22px; color: #4d9de8;">No</span></button>
  </div>

  <div style="flex-grow: 1;"></div>

  <div class="endbar">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6V4a2 2 0 0 1 2-2h2M14 2h2a2 2 0 0 1 2 2v2M18 14v2a2 2 0 0 1-2 2h-2M6 18H4a2 2 0 0 1-2-2v-2"></path><path d="M7 7.5v1M13 7.5v1M10 7.5v3.5H9M7.2 13.2a4 4 0 0 0 5.6 0"></path></svg>
    <span>End session…</span>
  </div>

  <div class="tabbar">
    <a class="tab" href="NeedsInput.html">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15z"></path><path d="M10 21.5h4"></path></svg>
        <div class="badge">3</div>
      </div>
      <div class="lbl">Needs input</div>
    </a>
    <a class="tab on" href="Main.html">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="7" r="1.1" fill="currentColor"></circle><circle cx="5" cy="12" r="1.1" fill="currentColor"></circle><circle cx="5" cy="17" r="1.1" fill="currentColor"></circle><path d="M9 7h11M9 12h11M9 17h11"></path></svg>
      </div>
      <div class="lbl">Sessions</div>
    </a>
    <a class="tab" href="Settings.html">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="8" cy="8" r="2.4"></circle><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"></path></svg>
      </div>
      <div class="lbl">Settings</div>
    </a>
  </div>
</div>
</body>
</html>
