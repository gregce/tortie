<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fix-login — Rename, at open</title>
<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
a { color: #4d9de8; }
.page { position: absolute; inset: 0; background: #131417; }
.dim { position: absolute; inset: 0; background: rgba(9, 10, 12, 0.55); }
.sheet { position: absolute; top: 54px; left: 0; right: 0; bottom: 0; background: #0E0F13; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.bar { height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; flex-shrink: 0; }
.field { height: 50px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; background: #191B20; border: 1px solid #25282E; border-radius: 10px; font-size: 17px; color: #C9CACD; }
.sel { background: rgba(77, 157, 232, 0.35); position: relative; }
.handle { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #4d9de8; }
.handle::after { content: ""; position: absolute; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: #4d9de8; }
.handle.start { left: -1px; }
.handle.start::after { top: -6px; }
.handle.end { right: -1px; }
.handle.end::after { bottom: -6px; }
.key { background: #202329; border-radius: 5px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #C9CACD; }
</style>
</head>
<body>
<!-- Phase 349 (build/p349/SPEC.md D1, D11, D18, D20, §4.4 step 5, §4.5 step
     6; his words "making it possible to rename sessions from the phone that
     it can access"): the Rename sheet AT OPEN, from the Terminal's ⋯
     (TerminalMenu.html) or a held row's menu (RowMenu.html). A sheet, in New
     session's family, because an alert closes on every button and a refusal
     would lose his text: the title is the Mac's own Rename, Cancel leads and
     the Mac's own Save name trails, drawn off while the name is the one the
     session already has. The field is the app's ONE text field
     (Screens/NameField.swift), the whole name prefilled and selected and the
     keyboard up, with smart quotes, smart dashes, autocorrection,
     capitalisation and spell checking off, so `fix--auth` and `it's` arrive
     as typed, at most 120 characters, as the Mac's own field takes. ONE line
     sits under the field only when it has a sentence (none at open): a name
     the Mac's rule refuses, or the Mac's own sentence for a refusal, which
     keeps the sheet and his text. Save name asks NO Face ID (his ruling,
     "No Face ID, just confirm"); done, the sheet closes and the Terminal's
     title takes the name the Mac stored. Opened from a row, the sheet reads
     the session first, so a name the list clips is prefilled whole. The page
     under the sheet is the Terminal, dimmed. The keyboard's Done key is drawn
     without its word: the phone draws none of its own there, iOS does. -->
<div class="t" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #C9CACD; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- The Terminal under the sheet, dimmed (TerminalMenu.html's page). -->
  <div class="page"></div>
  <div class="dim"></div>

  <div class="sheet">
    <!-- The sheet's bar: Cancel leads, the Mac's Rename is the title, and the
         Mac's Save name trails, off at open because the name is unchanged. -->
    <div class="bar">
      <div style="justify-self: start; font-size: 17px; color: #4d9de8;">Cancel</div>
      <div style="font-size: 17px; font-weight: 600; color: #C9CACD;">Rename</div>
      <div style="justify-self: end; font-size: 17px; font-weight: 600; color: #565b66;">Save name</div>
    </div>

    <div style="padding: 12px 16px 0 16px;">
      <!-- The one field: the whole name, selected by the first focus. -->
      <div class="field"><span class="sel"><span class="handle start"></span>fix-login<span class="handle end"></span></span></div>
    </div>

    <div style="flex-grow: 1;"></div>

    <!-- The keyboard, up at once. Return saves whenever Save name would. -->
    <div style="background: #202329; padding: 8px 4px 20px 4px; flex-shrink: 0;">
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; padding: 0 3px;">
        <div class="key">q</div><div class="key">w</div><div class="key">e</div><div class="key">r</div><div class="key">t</div><div class="key">y</div><div class="key">u</div><div class="key">i</div><div class="key">o</div><div class="key">p</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; padding: 5px 20px 0 20px;">
        <div class="key">a</div><div class="key">s</div><div class="key">d</div><div class="key">f</div><div class="key">g</div><div class="key">h</div><div class="key">j</div><div class="key">k</div><div class="key">l</div>
      </div>
      <div style="display: grid; grid-template-columns: 1.4fr repeat(7, minmax(0, 1fr)) 1.4fr; gap: 5px; padding: 5px 3px 0 3px;">
        <div class="key" style="background: #252931;">⇧</div><div class="key">z</div><div class="key">x</div><div class="key">c</div><div class="key">v</div><div class="key">b</div><div class="key">n</div><div class="key">m</div><div class="key" style="background: #252931;">⌫</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 4fr 1.6fr; gap: 5px; padding: 5px 3px 0 3px;">
        <div class="key" style="background: #252931;">123</div><div class="key">space</div><div class="key" style="background: #4d9de8;"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
