<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End a session</title>
<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.dim { position: absolute; inset: 0; background: rgba(9, 10, 12, 0.55); }
a { color: #4d9de8; }
</style>
</head>
<body>
<div class="t" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #C9CACD; position: relative; overflow: hidden;">

  <div style="padding: 44px 0 0 0;">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
      <a href="Main.html" style="display: flex; align-items: center; gap: 4px; font-size: 17px; color: #4d9de8; text-decoration: none;">
        <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2 3 9l6 7"></path></svg>Sessions
      </a>
      <div style="font-size: 17px; font-weight: 600;">nightly-tests</div>
      <span style="width: 18px;"></span>
    </div>
    <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px #e5655e;"></span>
        <span style="font-size: 17px;">Failed (exit 1)</span>
      </div>
      <div style="font-size: 15px; color: #9CA1AB;">Claude Code · webapp</div>
    </div>
  </div>

  <div class="dim"></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 8px;">

    <div style="background: #191B20; border: 1px solid #25282E; border-radius: 14px; overflow: hidden;">
      <div style="padding: 16px; text-align: center; border-bottom: 1px solid #25282E;">
        <div style="font-size: 17px; line-height: 22px; font-weight: 600;">End 'nightly-tests'?</div>
        <div style="font-size: 15px; line-height: 20px; color: #9CA1AB; margin-top: 6px;">The agent stops. Its saved output stays.</div>
      </div>
      <button type="button" style="width: 100%; height: 54px; border: 0; border-bottom: 1px solid #25282E; background: none; font: inherit; font-size: 17px; color: #e5655e; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="8" width="13" height="10.5" rx="2.5"></rect><path d="M4.5 8V5a3.5 3.5 0 0 1 7 0v3"></path></svg>
        End with Face ID
      </button>
      <button type="button" style="width: 100%; height: 54px; border: 0; background: none; font: inherit; font-size: 17px; color: #C9CACD; cursor: pointer;">Cancel</button>
    </div>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 190px; background: #191B20; border: 1px solid #25282E; border-radius: 10px; padding: 16px;">
    <div style="font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #9CA1AB;">What the phone will not do</div>
    <div style="font-size: 15px; line-height: 21px; color: #9CA1AB; margin-top: 8px;">No Restore — it would relaunch an agent with its safeguards off while nobody is watching.</div>
    <div style="font-size: 15px; line-height: 21px; color: #9CA1AB; margin-top: 6px;">No Remove — it deletes saved output.</div>
    <div style="font-size: 15px; line-height: 21px; color: #9CA1AB; margin-top: 6px;">No Restart.</div>
  </div>

</div>
</body>
</html>
