<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waiting on a choice</title>
<style>
html,body{background:#0E0F13}
body { margin: 0; }
.t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.card { background: #191B20; border: 1px solid #25282E; border-radius: 10px; padding: 16px; }
.dot-attention { width: 10px; height: 10px; border-radius: 50%; background: #f5b84a; animation: pulse 1.6s cubic-bezier(0.2, 0, 0, 1) infinite; flex-shrink: 0; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .dot-attention { animation: none; } }
.opt { min-height: 54px; background: #191B20; border: 1px solid #25282E; border-radius: 6px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
.chip { width: 24px; height: 24px; border-radius: 4px; background: #202329; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #9CA1AB; flex-shrink: 0; font-variant-numeric: tabular-nums; }
a { color: #4d9de8; }
</style>
</head>
<body>
<div class="t" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #C9CACD; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0;">
    <a href="Main.html" style="display: flex; align-items: center; gap: 4px; font-size: 17px; color: #4d9de8; text-decoration: none;">
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2 3 9l6 7"></path></svg>Sessions
    </a>
    <div style="font-size: 17px; font-weight: 600;">grok-docs</div>
    <button type="button" aria-label="Actions for grok-docs" style="background: none; border: 0; padding: 0; color: #9CA1AB; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="3" cy="9" r="1.6"></circle><circle cx="9" cy="9" r="1.6"></circle><circle cx="15" cy="9" r="1.6"></circle></svg>
    </button>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="dot-attention"></span>
      <span style="font-size: 17px; color: #f5b84a;">Needs input</span>
    </div>
    <div style="font-size: 15px; color: #9CA1AB;">Grok · docs-site</div>
  </div>

  <div class="card" style="margin: 0 16px;">
    <div style="font-size: 20px; line-height: 25px;">The agent is waiting for you.</div>
    <div style="font-size: 17px; line-height: 22px; margin-top: 8px;">Run <span style="font-family: ui-monospace, Menlo, monospace; font-size: 15px;">rm -rf build</span>?</div>
  </div>

  <div style="font-size: 15px; line-height: 20px; color: #9CA1AB; padding: 16px 16px 8px 16px;">Answer this in the session.</div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px;">
    <div class="opt"><span class="chip">1</span><span style="font-size: 17px; line-height: 22px; color: #9CA1AB;">Yes</span></div>
    <div class="opt"><span class="chip">2</span><span style="font-size: 17px; line-height: 22px; color: #9CA1AB;">Yes, and don’t ask again this session</span></div>
    <div class="opt"><span class="chip">3</span><span style="font-size: 17px; line-height: 22px; color: #9CA1AB;">No, and tell Grok what to do differently</span></div>
  </div>

  <a href="Session.html" style="margin: 16px 16px 0 16px; height: 54px; background: #191B20; border: 1px solid #25282E; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; color: #4d9de8; text-decoration: none;">
    Open in Terminal
    <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="#838996" stroke-width="1.8"><path d="M1.5 1.5 7 7.5l-5.5 6"></path></svg>
  </a>

  <div style="flex-grow: 1;"></div>

  <div style="border-top: 1px solid #25282E; padding: 8px 16px 16px 16px; flex-shrink: 0;">
    <div style="display: flex; align-items: flex-end; gap: 6px;">
      <label for="msg3" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Message this session</label>
      <input id="msg3" type="text" disabled placeholder="Message this session" style="flex-grow: 1; min-height: 36px; box-sizing: border-box; background: #191B20; border: 1px solid #25282E; border-radius: 4px; padding: 6px 8px; font: inherit; font-size: 17px; color: #565B66;">
      <button type="button" aria-label="Send" disabled style="width: 32px; height: 32px; border-radius: 50%; border: 0; background: #202329; color: #565B66; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V3.5M3.5 8 8 3.5 12.5 8"></path></svg>
      </button>
    </div>
    <div style="font-size: 13px; color: #838996; margin-top: 6px;">Goes to this session as one message.</div>
  </div>
</div>
</body>
</html>
