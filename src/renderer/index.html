<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tortie</title>
    <!-- Phase 20.5 added exactly one directive, `frame-src gmux-preview:`,
         and it is a net tightening rather than a widening. `frame-src` was
         unset, so it fell back to `default-src 'self'` and this document
         could frame its own files. It now frames one read-only scheme and
         not its own origin, and there were zero <iframe> and zero <webview>
         elements in the renderer before the HTML preview, so nothing lost a
         capability. It grants no fetch reach, no script source and no image
         source: research 37 §8.1 still holds, and the proof is a fetch() to
         a live local sink returning "Failed to fetch" with 0 requests
         logged. csp.test.ts pins this string so a second directive cannot
         arrive without someone deciding to add one. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: gmux-asset:; font-src 'self' data:; worker-src 'self' blob:; frame-src gmux-preview:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pre-paint ground: --bg-canvas before any stylesheet arrives, so
         launch never flashes a foreign color. color-scheme keeps native
         scrollbars/controls dark from the first frame. HTML cannot import a
         token, so this is a mirror of WINDOW_BACKGROUND (src/shared/
         window-chrome.ts); canvas-color-single-source.test.ts holds the
         three copies to one value. -->
    <style>
      html {
        background: #131417;
        color-scheme: dark;
      }
      /* Phase 213. The preload stamps data-scheme from main's argv before
         first paint, so a light launch never paints graphite first. Mirrors
         WINDOW_BACKGROUND_LIGHT. */
      html[data-scheme='light'] {
        background: #f5f7fa;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
