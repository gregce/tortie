<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tortie</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: gmux-asset:; font-src 'self' data:; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pre-paint ground: --bg-canvas before any stylesheet arrives, so
         launch never flashes a foreign color. color-scheme keeps native
         scrollbars/controls dark from the first frame. HTML cannot import a
         token, so this is a mirror of WINDOW_BACKGROUND (src/shared/
         window-chrome.ts); canvas-color-single-source.test.ts holds the
         three copies to one value. -->
    <style>
      html {
        background: #131417;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
