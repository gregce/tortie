# gmux private tmux server configuration.
# Loaded ONLY on the private socket:  tmux -L gmux -f resources/gmux-tmux.conf
# Never installed as, or merged into, the user's ~/.tmux.conf.
#
# Dev target: system tmux 3.6a (bundling a pinned tmux is out of scope today —
# see docs/FINAL-REPORT.md §5 Stream A1 for the shipping plan).

# gmux renders everything itself — no tmux chrome, ever.
set -g status off

# No ESC delay: agents and TUIs need instant escape sequences.
set -s escape-time 0

# CSI-u style extended key reporting for modern TUIs (Claude Code, Codex).
set -s extended-keys on

# Let applications pass escape sequences through untouched (OSC 52, images…).
set -g allow-passthrough on

# Deep server-side scrollback; the renderer caps its own view separately.
set -g history-limit 50000

# Forward focus in/out to applications (editors, agents watching focus).
set -s focus-events on

# Mouse stays OUT of tmux's hands. `mouse on` would make TMUX consume the
# mouse — it turns on xterm mouse reporting (ESC[?1000h/1002h/1006h) so every
# click, drag and right-click is delivered to the tmux server, which then
# draws its own pane menu and runs its own copy-mode selection. gmux renders
# all of that chrome itself (native context menus, its own splits), so tmux
# mouse mode buys nothing and costs two gestures the user actually wants:
# drag-to-select in xterm, and a right-click that opens ONE menu.
#
# `off` does NOT take the mouse away from applications: a TUI inside the pane
# (vim, an agent's picker) that requests mouse tracking still has that request
# forwarded out to the attach client, which is the passthrough this comment
# used to claim.
set -g mouse off

# Keep the server alive with zero sessions — the durability daemon must not
# die just because the last session closed.
set -s exit-empty off

# Correct terminfo inside panes (truecolor via terminal-overrides if needed).
set -g default-terminal "tmux-256color"

# Exit-code truth (§6.6): keep the pane alive ONLY when its process exits
# non-zero, so main can read #{pane_dead_status} before reaping the session
# and record the real exit code in the manifest. Clean exits (0) close the
# pane/session as before. Main also re-asserts this at boot (set-option -g)
# because a long-lived server started under an older conf never re-reads it.
set -g remain-on-exit failed
