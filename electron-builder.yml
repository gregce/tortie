# Tortie packaging. A signed arm64 DMG and ZIP (Phase 27, the release lane).
#
# SIGNING, and where the identity comes from. There is no `identity` key below
# on purpose. electron-builder discovers a "Developer ID Application"
# certificate in the keychain search list, which resolves differently in each
# of the three places a package is built, and every one of them is intended:
#
#   - the dev machine: the login keychain holds
#     "Developer ID Application: Gregory Ceccarelli (4GRQMF5T5U)", valid to
#     2031-06-02, so every local `npm run package` produces a really signed,
#     hardened-runtime app. Notarization does NOT run unless credentials are
#     in the env (see NOTARIZATION below), so the dev loop stays offline.
#   - the CI release lane: the workflow imports the APPLE_CERT_P12 secret into
#     a temporary keychain first (the deadreckon pattern), and discovery finds
#     it there. Do NOT use CSC_LINK: it imports the certificate only at
#     signApp time, which is AFTER the afterPack hook has already signed the
#     nested binaries, so the hook would fall back to ad-hoc and notarization
#     would reject the build. build/sign-nested-binaries.cjs fails fast if it
#     sees CSC_LINK with no keychain identity.
#   - the CI gates/durability/compat lanes: no certificate. Set
#     CSC_IDENTITY_AUTO_DISCOVERY=false there so the build is deterministically
#     unsigned (electron-builder also skips signing on PR builds by itself);
#     the afterPack hook then ad-hoc hardens the nested binaries exactly as
#     the pre-Phase-27 build did, and the packaged-dir smoke still runs.
#
# NOTARIZATION is env-gated, never forced. electron-builder 26.15.3 notarizes
# (and staples the .app, before the DMG and ZIP are cut — the order research
# 27 section 6.3 requires) when one of these credential sets is in the env,
# and skips with a warning otherwise:
#   - APPLE_KEYCHAIN_PROFILE=tortie-notary       <- the local release path;
#     the profile holds the credentials, no password ever touches a script
#   - APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID  <- the CI path,
#     from the five GitHub secrets (APPLE_APP_PWD maps to
#     APPLE_APP_SPECIFIC_PASSWORD in the workflow env)
# For an already-built release/ there is also the post-hoc path,
# build/notarize-local.mjs (submit DMG, wait, staple). The release gate either
# way is build/verify-signed.mjs; run it with --expect-notarized --artifacts
# before anything is published.
#
# NESTED BINARIES (specstory, the unpacked ripgrep, and since Phase 41 the
# pinned tmux) are signed inside-out by build/sign-nested-binaries.cjs at
# afterPack, with the real identity when one is discoverable and with stable
# reverse-DNS identifiers (<appId>.specstory, <appId>.rg, <appId>.tmux). The
# signIgnore list under `mac:` keeps @electron/osx-sign's whole-bundle walk
# from re-signing them, because a codesign --force without -i replaces a
# stable identifier with a filename-derived one (measured 2026-08-13). The
# signIgnore list and NESTED_BINARIES in build/sign-nested-binaries.cjs MUST
# stay in step; each file says so.
#
# Phase 41 closed the tmux deferral. Tortie carries its own tmux 3.7b, built
# from pinned source by build/build-tmux.mjs, and a packaged app resolves only
# that copy. A fresh Mac needs nothing installed first.
# Phase 27: Tortie ships under Itavero, the operator's LLC, not SpecStory
# (docs/BACKLOG.md, "Release lane", decided 2026-08-12). The data directory
# follows app.setName ("Tortie"), not this id, so no data migration happens.
# The SpecStory INTEGRATION keeps its name: the bundled specstory binary, the
# src/main/specstory module and the capture surfaces are a separate product
# Tortie talks to. The nested binary identifier below it is derived from this
# id by build/sign-nested-binaries.cjs, so it follows with no edit.
appId: com.itavero.tortie
productName: Tortie
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
# Phase 15: vendor the pinned specstory-cli release into build/vendor before
# extraResources are copied — the 41 MB Mach-O is NOT in git, so without this
# a fresh clone would silently package an app with no specstory in it.
# Idempotent and network-free once the pinned hash is on disk.
beforePack: build/before-pack.cjs
# Phase 13.8: electron-builder renames the helper BUNDLES and executables from
# productName but leaves their Info.plist CFBundleName at "Electron Helper (…)".
# This hook makes the two agree so every Tortie process answers to Tortie
# however macOS is asked. Phase 15 added a second step: hardening/signing the nested
# CLI binaries, which must happen BEFORE the app is sealed (Appendix F.3,
# inside-out). See build/after-pack.cjs.
afterPack: build/after-pack.cjs
files:
  - out/**
  - package.json
  # electron-vite bundles ALL renderer deps into out/renderer and the main
  # bundle only requires node-pty, better-sqlite3 and @parcel/watcher at
  # runtime (externalizeDepsPlugin) — so keep the renderer-only production
  # deps out of the asar. Their tiny transitive strays (scheduler, …) are
  # not worth chasing.
  - "!node_modules/monaco-editor/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/@xterm/**"
  - "!node_modules/zustand/**"
  # Phase 11 (@pierre/diffs + @pierre/trees) and their exclusive transitives.
  # Unlike the strays above these are NOT tiny — Shiki's grammars/themes alone
  # are ~18 MB on disk — and electron-vite code-splits every one of them into
  # out/renderer/assets, so shipping the packages too would double-pay.
  # `npm ls` confirms nothing outside the two Pierre packages pulls them in.
  - "!node_modules/@pierre/**"
  - "!node_modules/shiki/**"
  - "!node_modules/@shikijs/**"
  - "!node_modules/oniguruma-to-es/**"
  - "!node_modules/diff/**"
  - "!node_modules/lru_map/**"
  - "!node_modules/hast-util-to-html/**"
  - "!node_modules/preact/**"
  - "!node_modules/preact-render-to-string/**"
  # parse5 and its one dependency (entities) were on this denylist until the
  # Phase 27 release rehearsal: Phase 20.5 imported parse5 into MAIN (the
  # preview anchor rewrite in src/main/preview), so the packed 0.18.0 app
  # crashed in its first JavaScript tick with "Cannot find module 'parse5'" —
  # shown as a modal dialog, not a log line. Both now ship (~0.9 MB), and
  # build/assert-main-requires.cjs fails any future build whose main/preload
  # bundles require a package this file excludes.
  # Phase 12 (markdown preview): react-markdown + the remark/rehype/micromark
  # stack, ~80 packages, ALL renderer-only and all already bundled into
  # out/renderer/assets/markdown-impl-*.js. Main requires node-pty,
  # better-sqlite3 and @parcel/watcher and nothing here.
  # (This block is exactly the argument for the Phase 14 item that flips
  # `files` to an allowlist — three re-includes would replace all of it.)
  - "!node_modules/react-markdown/**"
  - "!node_modules/remark-*/**"
  - "!node_modules/rehype-*/**"
  - "!node_modules/unified/**"
  - "!node_modules/micromark*/**"
  - "!node_modules/mdast-util-*/**"
  - "!node_modules/hast-util-*/**"
  - "!node_modules/hastscript/**"
  - "!node_modules/unist-util-*/**"
  - "!node_modules/vfile*/**"
  - "!node_modules/property-information/**"
  - "!node_modules/style-to-js/**"
  - "!node_modules/style-to-object/**"
  - "!node_modules/inline-style-parser/**"
  - "!node_modules/parse-entities/**"
  - "!node_modules/stringify-entities/**"
  - "!node_modules/character-entities*/**"
  - "!node_modules/character-reference-invalid/**"
  - "!node_modules/decode-named-character-reference/**"
  - "!node_modules/is-alphabetical/**"
  - "!node_modules/is-alphanumerical/**"
  - "!node_modules/is-decimal/**"
  - "!node_modules/is-hexadecimal/**"
  - "!node_modules/is-plain-obj/**"
  - "!node_modules/markdown-table/**"
  - "!node_modules/longest-streak/**"
  - "!node_modules/web-namespaces/**"
  - "!node_modules/html-url-attributes/**"
  - "!node_modules/html-void-elements/**"
  - "!node_modules/estree-util-is-identifier-name/**"
  - "!node_modules/escape-string-regexp/**"
  - "!node_modules/extend/**"
  - "!node_modules/space-separated-tokens/**"
  - "!node_modules/comma-separated-tokens/**"
  - "!node_modules/trim-lines/**"
  - "!node_modules/devlop/**"
  - "!node_modules/zwitch/**"
  - "!node_modules/ccount/**"
  - "!node_modules/bail/**"
  - "!node_modules/trough/**"
  - "!node_modules/@ungap/**"
extraResources:
  # The private tmux server config rides in Contents/Resources/gmux-tmux.conf.
  # Main resolves it via process.resourcesPath when app.isPackaged
  # (src/main/tmux/supervisor.ts, src/main/attach/attach-host.ts).
  - from: resources/gmux-tmux.conf
    to: gmux-tmux.conf
  # Phase 12.85: the menu-bar status item's template images (copies of
  # docs/brand/tortie/menu-bar/, which is the authored master). They are read
  # at runtime by src/main/tray, so they cannot live in the renderer bundle.
  - from: resources/menu-bar
    to: menu-bar
  # Phase 23 (Tortie Config): the configuration folder's own documentation.
  # The guide, the generated JSON Schema and the six worked examples ride in
  # Contents/Resources/config/ and are copied into
  # <userData>/gmux/config/ the first time that folder is created, and again
  # after an update whenever the bytes differ. src/main/config/guide.ts
  # resolves it via process.resourcesPath, the same mechanism as
  # gmux-tmux.conf above.
  #
  # It is DOCUMENTATION AND DATA, never code. The seeder copies `.md` and
  # `.json` only, so this entry cannot become a way to place an executable
  # file in a folder Tortie tells people to open.
  - from: resources/config
    to: config
  # Phase 14 (symbols): SIX tree-sitter grammars and the web-tree-sitter
  # runtime, read at runtime by src/main/symbols/paths.ts from
  # process.resourcesPath/tree-sitter.
  #
  # WHY extraResources AND NOT asarUnpack: a .wasm is not a .node, so the
  # `**/*.node` rule above does not cover it, and `out/` resolves these out of
  # node_modules and passes WITHOUT this entry — the packaged app is the only
  # place a mistake here shows up (research 19 §2.8, §7.2). This is the
  # go/no-go check the symbols work is gated on.
  #
  # SIX, not sixteen: typescript 1,381 KB, tsx 1,412 KB, rust 1,088 KB,
  # python 447 KB, javascript 402 KB, go 212 KB = 4.8 MB. The package also
  # carries cpp (5.1 MB), c-sharp (4.9 MB), ruby (2.0 MB), bash, java, php,
  # powershell, css, ini and regex — ~14 MB for languages nobody in these
  # repos writes. Adding a seventh is a deliberate act with a size cost.
  - from: node_modules/@vscode/tree-sitter-wasm/wasm
    to: tree-sitter
    filter:
      - "tree-sitter-typescript.wasm"
      - "tree-sitter-tsx.wasm"
      - "tree-sitter-javascript.wasm"
      - "tree-sitter-go.wasm"
      - "tree-sitter-python.wasm"
      - "tree-sitter-rust.wasm"
  # web-tree-sitter's OWN runtime wasm. Never @vscode/tree-sitter-wasm's older
  # bundled tree-sitter.wasm — letting emscripten find that one yields
  # `ENOENT: web-tree-sitter.wasm` (research 19 §7.3).
  - from: node_modules/web-tree-sitter/web-tree-sitter.wasm
    to: tree-sitter/web-tree-sitter.wasm
  # Phase 15 (SpecStory): the pinned specstory-cli arm64 binary + the sidecar
  # that names its version, at Contents/Resources/bin/. Same mechanism as
  # gmux-tmux.conf — src/main/specstory/resolve.ts finds it via
  # process.resourcesPath — and the same reason it is extraResources rather
  # than asarUnpack: one STABLE path outside the asar, because signing keys off
  # it (mac.binaries below) and so does TCC attribution for anything the CLI
  # spawns (research 09 Appendix F.3).
  #
  # 41 MB uncompressed / ~16 MB in the DMG. It buys a capture toggle that works
  # on a machine that has never heard of SpecStory (research 13 §2.1-2.3).
  # The directory is produced by build/fetch-specstory.cjs from the pin in
  # build/specstory-release.json and is NOT in git; beforePack materialises it.
  - from: build/vendor/specstory/bin
    to: bin
  # Phase 41 (the bundled tmux): the pinned tmux 3.7b, at
  # Contents/Resources/bin/tmux, beside the specstory binary above.
  # src/main/tmux/resolve.ts finds it via process.resourcesPath, and in a
  # packaged app that is the ONLY path it looks at: no PATH probe, no Homebrew
  # path, and GMUX_TMUX_BIN refused.
  #
  # extraResources rather than asarUnpack, for the same two reasons as the
  # specstory row above and one more that is stronger here. Signing keys off a
  # stable path (mac.signIgnore below, and NESTED_BINARIES in
  # build/sign-nested-binaries.cjs). TCC attribution keys off it too, for every
  # process the tmux server's panes spawn, which is every agent the user runs.
  # And the server started from this path OUTLIVES the app on purpose, so the
  # path must be one thing that does not move.
  #
  # 1,437,872 bytes as built, 1,456,160 bytes once signed, which is 0.83
  # percent of the DMG. It is BUILT, not downloaded: tmux publishes source
  # only. build/build-tmux.mjs compiles it from the three tarballs pinned by
  # SHA-256 in build/tmux-release.json, and the output directory is NOT in
  # git; beforePack materialises it.
  - from: build/vendor/tmux/bin/tmux
    to: bin/tmux
  # Phase 22 (the Context sidebar): the pinned `skills` CLI, at
  # Contents/Resources/skills-cli/. src/main/skills/resolve.ts finds it via
  # process.resourcesPath and runs it with Electron's own Node
  # (ELECTRON_RUN_AS_NODE=1), so the machine needs no node, npm or npx.
  #
  # 2.4 MB after build/fetch-skills.cjs trims the documentation, the type
  # declarations and the source maps. It is PURE JAVASCRIPT — the fetch script
  # fails the build if a .node, .dylib, .so, .wasm or binding.gyp ever appears
  # — so unlike the specstory binary above it needs no mac.binaries row, no
  # sign-nested-binaries.cjs row and no entitlements.
  #
  # THE DIRECTORY NAME IS LOAD BEARING. `skills-cli/node_modules` must stay
  # literally that: dist/cli.mjs imports `yaml` and `tar` by bare name and Node
  # walks up looking for a directory with exactly that name. Renaming it gives
  # ERR_MODULE_NOT_FOUND at run time and passes every check at pack time.
  #
  # WHY THIS COPIES THE node_modules DIRECTORY ITSELF rather than its parent,
  # which is not a style choice. app-builder-lib/out/util/filter.js line 43 is
  # `if (relative === "node_modules") return false`, so a directory whose path
  # relative to the copy root is exactly `node_modules` is dropped
  # unconditionally, and no `filter:` can re-include it. Measured, not guessed:
  # a single `from: build/vendor/skills` entry produced a Resources/skills-cli
  # holding package.json, package-lock.json and skills.json, 12 KB, and no CLI
  # at all. `out/` passed. `npm run typecheck`, `npm run build` and every unit
  # test passed. The only thing that caught it was running the entry point out
  # of the packed .app, which build/assert-skills-cli.cjs now does on every
  # build (research 19 section 7.2, the same trap as the tree-sitter wasm).
  #
  # Making the copy root the node_modules directory itself means the relative
  # paths inside it are `skills`, `yaml`, `tar` and so on, and the rule never
  # fires.
  #
  # extraResources rather than asarUnpack for the same reason as the two above:
  # one stable path outside the asar. The tree is produced by
  # build/fetch-skills.cjs from the pin in build/skills-release.json and is NOT
  # in git; beforePack materialises it.
  - from: build/vendor/skills/node_modules
    to: skills-cli/node_modules
  # The spawn-free version sidecar, read by src/main/skills/resolve.ts so
  # Settings can name the bundled version without starting anything.
  - from: build/vendor/skills/skills.json
    to: skills-cli/skills.json
asarUnpack:
  - "**/*.node"
  # Phase 14: the vendored ripgrep Mach-O (@vscode/ripgrep-darwin-arm64) is
  # not a .node file, so the line above does not cover it. Unpacking is
  # required for CORRECTNESS today and for SIGNING later:
  #   - spawning from inside the asar works only because Electron's shim
  #     copies all 4,528,512 bytes to /tmp on first spawn, unsigned — which
  #     fails library validation the moment this app gets a real identity and
  #     a hardened runtime;
  #   - electron-builder re-signs nested Mach-O binaries only for files it has
  #     unpacked.
  # src/main/search/resolve.ts rewrites app.asar → app.asar.unpacked to match.
  # `out/` passes WITHOUT this line; only the packaged app catches its absence.
  - "**/@vscode/ripgrep-*/bin/*"
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  # Phase 12.85: build/icon.icns is a byte-for-byte copy of the brand
  # package's docs/brand/tortie/macos/Tortie.icns (the seated sentinel).
  # `npm run icon` re-copies it; nothing generates it from an SVG any more.
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Phase 27: real signing. No `identity` key here on purpose — the header of
  # this file explains where discovery finds the certificate in each of the
  # three build environments, and why CSC_LINK must not be used.
  hardenedRuntime: true
  # False on purpose. gatekeeperAssess runs `spctl --assess` right after
  # signing, BEFORE notarization can have happened, and macOS 10.15.5+ rejects
  # every not-yet-notarized Developer ID app — so `true` would fail every
  # build unconditionally. The real Gatekeeper check lives in
  # build/verify-signed.mjs, which knows whether to expect "Unnotarized
  # Developer ID" (after packaging) or "Notarized Developer ID" (the release
  # gate, --expect-notarized).
  gatekeeperAssess: false
  # The three entitlements Electron needs under the hardened runtime, and
  # nothing else (research 27 section 6.2). The helpers inherit the same set.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Phase 27, replacing the Phase 15 `binaries:` list. The nested Mach-O
  # binaries (specstory, the unpacked ripgrep, and since Phase 41 the pinned
  # tmux) are signed at afterPack by build/sign-nested-binaries.cjs —
  # inside-out, with the real identity when one is discoverable, and with
  # STABLE reverse-DNS identifiers. This signIgnore list keeps
  # @electron/osx-sign's whole-bundle walk from re-signing them, because
  # codesign --force without -i replaces a stable identifier with a
  # filename-derived one (measured 2026-08-13: a re-sign without -i turned
  # com.probe.custom into rg-probe-5555...).
  #
  # MUST STAY IN STEP with NESTED_BINARIES in build/sign-nested-binaries.cjs.
  # A path listed here that the hook does not sign ships with the upstream
  # linker ad-hoc signature inside a Developer ID app, and notarization
  # rejects exactly that. build/verify-signed.mjs checks every entry.
  signIgnore:
    - '/Resources/bin/specstory$'
    - '/Resources/bin/tmux$'
    - '/Resources/app\.asar\.unpacked/node_modules/@vscode/ripgrep-darwin-arm64/bin/rg$'
dmg:
  # Plain drag-to-Applications layout; no signing, no license panel.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
# Phase 27: publish configuration exists so the packager EMITS the
# electron-updater feed file. With `publish: null` no latest-mac.yml was
# generated at all (research 27 section 3.7.1); the .blockmap files already
# were. Nothing uploads from a local build: without a GH_TOKEN in the env
# electron-builder only writes release/latest-mac.yml next to the DMG, the
# ZIP and their blockmaps. The release workflow publishes those five files to
# a DRAFT GitHub release itself; a human promotes the draft (section 3.7.1).
# releaseType is belt and braces for any path where electron-builder does the
# upload.
publish:
  provider: github
  owner: gregce
  repo: tortie
  releaseType: draft
