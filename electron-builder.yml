# Tortie packaging. A local unsigned arm64 DMG and ZIP.
#
# This header used to say that only an Apple Development certificate is on this
# machine. That is false, and it was the only recorded blocker on notarization.
# Measured again on 2026-08-12 with `security find-identity -v -p codesigning`:
#
#   Developer ID Application: Gregory Ceccarelli (4GRQMF5T5U)
#   valid 2026-06-01 to 2031-06-02
#
# So `identity: null` below is a build that has not been switched on yet, not a
# build that cannot be signed. One credential is still missing, and it is the
# App Store Connect ISSUER id, a UUID that notarytool needs next to the key. The
# key itself is on disk at ~/.appstoreconnect/private_keys/AuthKey_8NH6JLTWBN.p8.
# The issuer id is not in the shell rc files and there is no saved notarytool
# keychain profile, so nothing here has ever run a notarization round trip. It
# is one copy and paste from App Store Connect, under Users and Access, then
# Integrations, then Keys.
#
# Here is what `identity: null` actually produces, measured on the installed
# app rather than assumed. electron-builder does not sign the bundle at all.
# There is no Contents/_CodeSignature. `codesign -dv` reports
# `Identifier=Electron`, `flags=0x20002(adhoc,linker-signed)` and
# `Sealed Resources=none`. That is the linker's own signature on each Mach-O,
# not a signature electron-builder applied. The app runs here because it was
# built here and never carried a quarantine flag. It would not run on another
# machine.
#
# Switching signing on is four changes, spelled out in
# docs/research/27-release-and-updates.md section 6.2: an identity here,
# hardenedRuntime, the Electron entitlements, and notarize with the notarytool
# credentials above.
#
# Still deferred: a bundled pinned tmux (the app uses system tmux 3.6a today,
# see BUILD-STATUS.md) and an auto-update feed.
# No longer deferred: nested Mach-O signing. Phase 15 bundles specstory-cli at
# Contents/Resources/bin/specstory. It is listed in mac.binaries for the day an
# identity is set, and build/sign-nested-binaries.cjs ad-hoc hardens it today.
appId: com.specstory.tortie
productName: Tortie
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
# Phase 15: vendor the pinned specstory-cli release into build/vendor before
# extraResources are copied — the 41 MB Mach-O is NOT in git, so without this
# a fresh clone would silently package an app with no specstory in it.
# Idempotent and network-free once the pinned hash is on disk.
beforePack: build/before-pack.cjs
# Phase 13.8: electron-builder renames the helper BUNDLES and executables from
# productName but leaves their Info.plist CFBundleName at "Electron Helper (…)".
# This hook makes the two agree so every Tortie process answers to Tortie
# however macOS is asked. Phase 15 added a second step: hardening/signing the nested
# CLI binaries, which must happen BEFORE the app is sealed (Appendix F.3,
# inside-out). See build/after-pack.cjs.
afterPack: build/after-pack.cjs
files:
  - out/**
  - package.json
  # electron-vite bundles ALL renderer deps into out/renderer and the main
  # bundle only requires node-pty, better-sqlite3 and @parcel/watcher at
  # runtime (externalizeDepsPlugin) — so keep the renderer-only production
  # deps out of the asar. Their tiny transitive strays (scheduler, …) are
  # not worth chasing.
  - "!node_modules/monaco-editor/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/@xterm/**"
  - "!node_modules/zustand/**"
  # Phase 11 (@pierre/diffs + @pierre/trees) and their exclusive transitives.
  # Unlike the strays above these are NOT tiny — Shiki's grammars/themes alone
  # are ~18 MB on disk — and electron-vite code-splits every one of them into
  # out/renderer/assets, so shipping the packages too would double-pay.
  # `npm ls` confirms nothing outside the two Pierre packages pulls them in.
  - "!node_modules/@pierre/**"
  - "!node_modules/shiki/**"
  - "!node_modules/@shikijs/**"
  - "!node_modules/oniguruma-to-es/**"
  - "!node_modules/diff/**"
  - "!node_modules/lru_map/**"
  - "!node_modules/hast-util-to-html/**"
  - "!node_modules/preact/**"
  - "!node_modules/preact-render-to-string/**"
  # Phase 12 (markdown preview): react-markdown + the remark/rehype/micromark
  # stack, ~80 packages, ALL renderer-only and all already bundled into
  # out/renderer/assets/markdown-impl-*.js. Main requires node-pty,
  # better-sqlite3 and @parcel/watcher and nothing here.
  # (This block is exactly the argument for the Phase 14 item that flips
  # `files` to an allowlist — three re-includes would replace all of it.)
  - "!node_modules/react-markdown/**"
  - "!node_modules/remark-*/**"
  - "!node_modules/rehype-*/**"
  - "!node_modules/unified/**"
  - "!node_modules/micromark*/**"
  - "!node_modules/mdast-util-*/**"
  - "!node_modules/hast-util-*/**"
  - "!node_modules/hastscript/**"
  - "!node_modules/unist-util-*/**"
  - "!node_modules/vfile*/**"
  - "!node_modules/parse5/**"
  - "!node_modules/property-information/**"
  - "!node_modules/style-to-js/**"
  - "!node_modules/style-to-object/**"
  - "!node_modules/inline-style-parser/**"
  - "!node_modules/parse-entities/**"
  - "!node_modules/stringify-entities/**"
  - "!node_modules/character-entities*/**"
  - "!node_modules/character-reference-invalid/**"
  - "!node_modules/decode-named-character-reference/**"
  - "!node_modules/is-alphabetical/**"
  - "!node_modules/is-alphanumerical/**"
  - "!node_modules/is-decimal/**"
  - "!node_modules/is-hexadecimal/**"
  - "!node_modules/is-plain-obj/**"
  - "!node_modules/markdown-table/**"
  - "!node_modules/longest-streak/**"
  - "!node_modules/web-namespaces/**"
  - "!node_modules/html-url-attributes/**"
  - "!node_modules/html-void-elements/**"
  - "!node_modules/estree-util-is-identifier-name/**"
  - "!node_modules/entities/**"
  - "!node_modules/escape-string-regexp/**"
  - "!node_modules/extend/**"
  - "!node_modules/space-separated-tokens/**"
  - "!node_modules/comma-separated-tokens/**"
  - "!node_modules/trim-lines/**"
  - "!node_modules/devlop/**"
  - "!node_modules/zwitch/**"
  - "!node_modules/ccount/**"
  - "!node_modules/bail/**"
  - "!node_modules/trough/**"
  - "!node_modules/@ungap/**"
extraResources:
  # The private tmux server config rides in Contents/Resources/gmux-tmux.conf.
  # Main resolves it via process.resourcesPath when app.isPackaged
  # (src/main/tmux/supervisor.ts, src/main/attach/attach-host.ts).
  - from: resources/gmux-tmux.conf
    to: gmux-tmux.conf
  # Phase 12.85: the menu-bar status item's template images (copies of
  # docs/brand/tortie/menu-bar/, which is the authored master). They are read
  # at runtime by src/main/tray, so they cannot live in the renderer bundle.
  - from: resources/menu-bar
    to: menu-bar
  # Phase 14 (symbols): SIX tree-sitter grammars and the web-tree-sitter
  # runtime, read at runtime by src/main/symbols/paths.ts from
  # process.resourcesPath/tree-sitter.
  #
  # WHY extraResources AND NOT asarUnpack: a .wasm is not a .node, so the
  # `**/*.node` rule above does not cover it, and `out/` resolves these out of
  # node_modules and passes WITHOUT this entry — the packaged app is the only
  # place a mistake here shows up (research 19 §2.8, §7.2). This is the
  # go/no-go check the symbols work is gated on.
  #
  # SIX, not sixteen: typescript 1,381 KB, tsx 1,412 KB, rust 1,088 KB,
  # python 447 KB, javascript 402 KB, go 212 KB = 4.8 MB. The package also
  # carries cpp (5.1 MB), c-sharp (4.9 MB), ruby (2.0 MB), bash, java, php,
  # powershell, css, ini and regex — ~14 MB for languages nobody in these
  # repos writes. Adding a seventh is a deliberate act with a size cost.
  - from: node_modules/@vscode/tree-sitter-wasm/wasm
    to: tree-sitter
    filter:
      - "tree-sitter-typescript.wasm"
      - "tree-sitter-tsx.wasm"
      - "tree-sitter-javascript.wasm"
      - "tree-sitter-go.wasm"
      - "tree-sitter-python.wasm"
      - "tree-sitter-rust.wasm"
  # web-tree-sitter's OWN runtime wasm. Never @vscode/tree-sitter-wasm's older
  # bundled tree-sitter.wasm — letting emscripten find that one yields
  # `ENOENT: web-tree-sitter.wasm` (research 19 §7.3).
  - from: node_modules/web-tree-sitter/web-tree-sitter.wasm
    to: tree-sitter/web-tree-sitter.wasm
  # Phase 15 (SpecStory): the pinned specstory-cli arm64 binary + the sidecar
  # that names its version, at Contents/Resources/bin/. Same mechanism as
  # gmux-tmux.conf — src/main/specstory/resolve.ts finds it via
  # process.resourcesPath — and the same reason it is extraResources rather
  # than asarUnpack: one STABLE path outside the asar, because signing keys off
  # it (mac.binaries below) and so does TCC attribution for anything the CLI
  # spawns (research 09 Appendix F.3).
  #
  # 41 MB uncompressed / ~16 MB in the DMG. It buys a capture toggle that works
  # on a machine that has never heard of SpecStory (research 13 §2.1-2.3).
  # The directory is produced by build/fetch-specstory.cjs from the pin in
  # build/specstory-release.json and is NOT in git; beforePack materialises it.
  - from: build/vendor/specstory/bin
    to: bin
  # Phase 22 (the Context sidebar): the pinned `skills` CLI, at
  # Contents/Resources/skills-cli/. src/main/skills/resolve.ts finds it via
  # process.resourcesPath and runs it with Electron's own Node
  # (ELECTRON_RUN_AS_NODE=1), so the machine needs no node, npm or npx.
  #
  # 2.4 MB after build/fetch-skills.cjs trims the documentation, the type
  # declarations and the source maps. It is PURE JAVASCRIPT — the fetch script
  # fails the build if a .node, .dylib, .so, .wasm or binding.gyp ever appears
  # — so unlike the specstory binary above it needs no mac.binaries row, no
  # sign-nested-binaries.cjs row and no entitlements.
  #
  # THE DIRECTORY NAME IS LOAD BEARING. `skills-cli/node_modules` must stay
  # literally that: dist/cli.mjs imports `yaml` and `tar` by bare name and Node
  # walks up looking for a directory with exactly that name. Renaming it gives
  # ERR_MODULE_NOT_FOUND at run time and passes every check at pack time.
  #
  # WHY THIS COPIES THE node_modules DIRECTORY ITSELF rather than its parent,
  # which is not a style choice. app-builder-lib/out/util/filter.js line 43 is
  # `if (relative === "node_modules") return false`, so a directory whose path
  # relative to the copy root is exactly `node_modules` is dropped
  # unconditionally, and no `filter:` can re-include it. Measured, not guessed:
  # a single `from: build/vendor/skills` entry produced a Resources/skills-cli
  # holding package.json, package-lock.json and skills.json, 12 KB, and no CLI
  # at all. `out/` passed. `npm run typecheck`, `npm run build` and every unit
  # test passed. The only thing that caught it was running the entry point out
  # of the packed .app, which build/assert-skills-cli.cjs now does on every
  # build (research 19 section 7.2, the same trap as the tree-sitter wasm).
  #
  # Making the copy root the node_modules directory itself means the relative
  # paths inside it are `skills`, `yaml`, `tar` and so on, and the rule never
  # fires.
  #
  # extraResources rather than asarUnpack for the same reason as the two above:
  # one stable path outside the asar. The tree is produced by
  # build/fetch-skills.cjs from the pin in build/skills-release.json and is NOT
  # in git; beforePack materialises it.
  - from: build/vendor/skills/node_modules
    to: skills-cli/node_modules
  # The spawn-free version sidecar, read by src/main/skills/resolve.ts so
  # Settings can name the bundled version without starting anything.
  - from: build/vendor/skills/skills.json
    to: skills-cli/skills.json
asarUnpack:
  - "**/*.node"
  # Phase 14: the vendored ripgrep Mach-O (@vscode/ripgrep-darwin-arm64) is
  # not a .node file, so the line above does not cover it. Unpacking is
  # required for CORRECTNESS today and for SIGNING later:
  #   - spawning from inside the asar works only because Electron's shim
  #     copies all 4,528,512 bytes to /tmp on first spawn, unsigned — which
  #     fails library validation the moment this app gets a real identity and
  #     a hardened runtime;
  #   - electron-builder re-signs nested Mach-O binaries only for files it has
  #     unpacked.
  # src/main/search/resolve.ts rewrites app.asar → app.asar.unpacked to match.
  # `out/` passes WITHOUT this line; only the packaged app catches its absence.
  - "**/@vscode/ripgrep-*/bin/*"
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  # Phase 12.85: build/icon.icns is a byte-for-byte copy of the brand
  # package's docs/brand/tortie/macos/Tortie.icns (the seated sentinel).
  # `npm run icon` re-copies it; nothing generates it from an SVG any more.
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # No distributable signing identity on this machine (Apple Development
  # only). null ⇒ skip real codesigning; arm64 gets an ad-hoc signature so
  # macOS will execute it locally. Gatekeeper on OTHER machines will warn —
  # right-click → Open, documented in BUILD-STATUS.md.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # Phase 15 — the nested Mach-O list for the signing pass (Appendix F.3:
  # notarization rejects any embedded binary that is not Developer ID-signed
  # with hardened runtime, and signing is inside-out). Relative paths are
  # resolved against the .app root by app-builder-lib.
  #
  # This list is INERT while `identity: null` — electron-builder's sign() bails
  # at handleNullIdentity() before it ever reads `binaries`. Until an identity
  # exists, build/sign-nested-binaries.cjs signs the same file ad-hoc with
  # hardened runtime from the afterPack hook, so today's build already carries
  # the shape notarization will want. Keep the two lists in step.
  #
  # ZERO entitlements are needed for it: CGO-free Go, no JIT, no unsigned
  # executable memory, and `otool -L` shows only Apple system dylibs, so
  # library validation is satisfied trivially.
  binaries:
    - Contents/Resources/bin/specstory
dmg:
  # Plain drag-to-Applications layout; no signing, no license panel.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish: null
