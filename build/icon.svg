<?xml version="1.0" encoding="UTF-8"?>
<!--
  gmux app icon — geometric terminal glyph.
  Language: the brand's graphite canvas (#131417 family) as a macOS Big Sur
  rounded square, a bold prompt chevron in the single accent blue (#4D9DE8),
  and a block cursor in attention amber (#F5B84A) — the "needs you" color,
  the loudest object in the UI, here as the loudest object in the icon.
  Grid: 1024 canvas, 824x824 plate centered (Apple icon-grid margins),
  corner radius 185.
  Render: rsvg-convert -w <px> -h <px> icon.svg  → iconset → iconutil.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2026"/>
      <stop offset="1" stop-color="#131519"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB4F2"/>
      <stop offset="1" stop-color="#4D9DE8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4F5A" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#3A3E48" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3A3E48" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Plate -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#drop)"/>
  <!-- Rim highlight (1px-feel hairline, brighter at the top) -->
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Session tallies: three stacked marks, top-right — many named sessions,
       one held by the amber cursor's session below. Quiet, muted gray. -->
  <g fill="#565B66">
    <rect x="676" y="268" width="88" height="26" rx="13"/>
    <rect x="676" y="330" width="88" height="26" rx="13" opacity="0.72"/>
    <rect x="676" y="392" width="88" height="26" rx="13" opacity="0.44"/>
  </g>

  <!-- Prompt chevron — accent blue, round joints, optically centered -->
  <path d="M 348 396 L 486 528 L 348 660"
        fill="none" stroke="url(#chevron)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Block cursor — attention amber, sits on the prompt baseline -->
  <rect x="556" y="620" width="150" height="78" rx="18" fill="#F5B84A"/>
</svg>
