  - paragraph [ref=f2e3]: This names a machine Tortie will sign in to as you, and a program it will run there with your files and your credentials. Confirming seals which program Tortie runs on that machine. It cannot seal the bytes of that program. Anyone who can write to that machine can change it, and Tortie will not see that happen.
